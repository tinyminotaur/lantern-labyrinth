<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lantern Labyrinth</title>
<meta name="description" content="Guide a tiny minotaur through six shifting labyrinths. Eat the wisps, dodge the ghost and the wardens, and grab powerups. A Tiny Minotaur game.">
<meta property="og:title" content="Lantern Labyrinth">
<meta property="og:description" content="Guide a tiny minotaur through six shifting labyrinths. A Tiny Minotaur game.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#1d0f08">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gabarito:wght@600;800&family=DM+Mono:wght@400;500&family=Cinzel:wght@700;800&family=Press+Start+2P&family=Rubik+Mono+One&family=Fredoka:wght@600;700&family=Caveat:wght@600;700&display=swap">
<style>
/* Layout: full-height column. Slim header + live stats, one maze arena taking the remaining space, a power-up status row, then a compact legend. Single look: a lamplit labyrinth at night. */
:root {
  --ink: #130f1f;
  --ink-2: #1c1630;
  --line: #3a2f5c;
  --bone: #f1ecff;
  --dim: #9a8fc0;
  --torch: #ffb347;
  --font-display: "Gabarito", system-ui, sans-serif;
  --font-mono: "DM Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--ink);
  color: var(--bone);
  font-family: var(--font-display);
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding-inline: 16px;
  padding-block: 12px;
  overflow: hidden;
  box-sizing: border-box;
}
header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 16px; }
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
h1 { margin: 0; font-family: var(--font-title, "Cinzel"), var(--font-display); font-size: 21px; font-weight: 800; letter-spacing: -0.01em; text-wrap: balance; }
.sub { font: 500 11px var(--font-mono); color: var(--dim); text-transform: uppercase; letter-spacing: 0.12em; }
.hud { display: flex; gap: 18px; font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.hud div { display: flex; flex-direction: column; align-items: flex-end; line-height: 1.1; }
.hud span { font-size: 10px; color: var(--dim); text-transform: uppercase; letter-spacing: 0.12em; }
.hud b { font-size: 18px; font-weight: 500; }
#hLives.low { color: #ff6b6b; }

#goal { display: flex; flex-direction: column; gap: 6px; }
.goalrow { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 2px 14px; align-items: baseline; }
#gTitle { font-size: 16px; font-weight: 800; color: var(--torch); text-wrap: balance; }
#gProg { font: 500 13px var(--font-mono); color: var(--bone); font-variant-numeric: tabular-nums; }
.bar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--torch); border-radius: 3px; transition: width 0.25s; }
#arena {
  position: relative; flex: 1; min-height: 260px;
  border-radius: 14px; overflow: hidden;
  background: radial-gradient(120% 90% at 50% 40%, var(--ink-2), var(--ink));
  cursor: none; touch-action: none; user-select: none; -webkit-user-select: none;
}
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#overlay { position: absolute; inset: 0; display: grid; place-items: center; padding: 16px; pointer-events: none; }
#overlay[hidden] { display: none; }
.card {
  pointer-events: auto; cursor: default; max-width: 360px; text-align: center;
  background: rgba(19, 15, 31, 0.92); border: 1px solid var(--line); border-radius: 14px;
  padding: 18px 20px; display: flex; flex-direction: column; gap: 10px;
}
.card h2 { margin: 0; font-family: var(--font-title, "Cinzel"), var(--font-display); font-size: 24px; font-weight: 800; }
.card p { margin: 0; font-size: 14px; line-height: 1.45; color: var(--dim); }
.card p b { color: var(--bone); font-weight: 600; }
.card .goal { font-size: 15px; color: var(--bone); }
.card .big { font: 500 40px var(--font-mono); color: var(--torch); }
button {
  font: 800 16px var(--font-display); color: #1b1200; background: var(--torch);
  border: 0; border-radius: 10px; padding: 11px 18px; cursor: pointer;
}
button.gear { display: inline-grid; place-items: center; width: 32px; height: 28px; padding: 0; background: transparent; color: var(--dim); border: 1px solid var(--line); border-radius: 6px; align-self: center; }
button.gear:hover { color: var(--bone); filter: none; }
.settings { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; padding: 16px; background: rgba(8, 5, 10, 0.72); backdrop-filter: blur(3px); }
.settings[hidden] { display: none; }
.sheet { width: min(460px, 100%); max-height: calc(100% - 8px); overflow: auto; background: var(--ink-2); border: 1px solid var(--line); border-radius: 16px; padding: 18px 18px 20px; display: flex; flex-direction: column; gap: 16px; }
.sh-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.sh-head h2 { margin: 0; font-family: var(--font-title, "Cinzel"), var(--font-display); font-size: 22px; }
.sh-head button { padding: 8px 14px; font-size: 14px; }
.row { display: flex; align-items: center; gap: 12px; }
.row > span:first-child { flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.row small, .opt small { color: var(--dim); font: 400 12px/1.4 var(--font-mono); }
.state { font: 500 12px var(--font-mono); color: var(--dim); min-width: 2.2em; text-align: right; }
.switch { width: 46px; height: 26px; padding: 0; border-radius: 99px; background: var(--line); position: relative; flex: none; }
.switch i { position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--bone); transition: transform 0.15s; }
.switch[aria-checked="true"] { background: var(--torch); }
.switch[aria-checked="true"] i { transform: translateX(20px); background: #1b1200; }
fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }
legend { padding: 0 0 8px; font: 500 11px var(--font-mono); text-transform: uppercase; letter-spacing: 0.12em; color: var(--dim); }
.styles { display: flex; flex-direction: column; gap: 8px; }
.opt { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; cursor: pointer; }
.opt:has(input:checked) { border-color: var(--torch); background: rgba(255, 255, 255, 0.04); }
.opt:has(input:focus-visible) { outline: 2px solid var(--bone); outline-offset: 2px; }
.opt input { position: absolute; opacity: 0; pointer-events: none; }
.opt .sw { display: flex; flex: none; border-radius: 8px; overflow: hidden; border: 1px solid var(--line); }
.opt .sw i { display: block; width: 14px; height: 34px; }
.opt .tx { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.opt b { font-size: 15px; font-weight: 600; }
.credit { margin: 0; font: 400 12px/1.4 var(--font-mono); color: var(--dim); }
.credit a { color: var(--torch); }
#hLives { display: flex; gap: 2px; align-items: center; min-height: 22px; }
#hLives svg { display: block; }
#hLives .gone { opacity: 0.2; }
.card .btnrow { display: flex; gap: 8px; }
.card .btnrow button { flex: 1; }
.card button.alt { background: transparent; color: var(--bone); border: 1px solid var(--line); padding: 9px 12px; font-size: 14px; }
@media (max-width: 560px), (max-height: 640px) { #legend { display: none; } }
button.mute {
  font: 500 11px var(--font-mono); color: var(--dim); background: transparent; border: 1px solid var(--line);
  border-radius: 6px; padding: 3px 8px; align-self: center; letter-spacing: 0.04em;
}
button:hover { filter: brightness(1.08); }
button:focus-visible { outline: 2px solid var(--bone); outline-offset: 3px; }

#status { display: flex; flex-wrap: wrap; gap: 6px 8px; min-height: 22px; align-items: center; font: 500 11px var(--font-mono); color: var(--dim); }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px; border-radius: 99px; border: 1px solid var(--c); color: var(--bone); font-variant-numeric: tabular-nums; }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--c); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font: 400 12px var(--font-mono); color: var(--dim); }
.legend span { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.legend canvas.lg { width: 22px; height: 22px; border-radius: 5px; display: block; }
@media (max-width: 520px) {
  h1 { font-size: 19px; }
  .hud { gap: 12px; }
  .hud b { font-size: 16px; }
  .legend { font-size: 11px; gap: 5px 10px; }
}
</style>
<style>
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; }
[hidden] { display: none !important; }
@supports (height: 100dvh) { html, body { height: 100dvh; } }
</style>
</head>
<body>


<header>
  <div class="brand"><h1>Lantern Labyrinth</h1><span class="sub">tiny minotaur</span></div>
  <div class="hud">
    <div><span>Floor</span><b id="hLevel">1/6</b></div>
    <div><span>Score</span><b id="hScore">0</b></div>
    <div><span>Lives</span><b id="hLives">5</b></div>
    <button class="gear" id="gear" type="button" aria-label="Settings" aria-expanded="false" aria-controls="settings"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M12 8.6a3.4 3.4 0 1 0 0 6.8 3.4 3.4 0 0 0 0-6.8zM19.4 13.5l1.6 1.2-1.7 3-1.9-.7a7.5 7.5 0 0 1-1.7 1l-.3 2h-3.4l-.3-2a7.5 7.5 0 0 1-1.7-1l-1.9.7-1.7-3 1.6-1.2a7.7 7.7 0 0 1 0-2l-1.6-1.2 1.7-3 1.9.7a7.5 7.5 0 0 1 1.7-1l.3-2h3.4l.3 2a7.5 7.5 0 0 1 1.7 1l1.9-.7 1.7 3-1.6 1.2c.1.7.1 1.3 0 2z"/></svg></button>
  </div>
</header>

<div id="goal">
  <div class="goalrow"><span id="gTitle">Floor 1: Eat 25 wisps</span><span id="gProg">0/25</span></div>
</div>

<div id="arena">
  <canvas id="cv"></canvas>
  <div id="overlay"></div>
</div>

<div id="status"></div>
<div class="legend" id="legend"></div>

<div id="settings" class="settings" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="setTitle">
    <div class="sh-head"><h2 id="setTitle">Settings</h2><button id="setClose" type="button">Done</button></div>
    <div class="row"><span><b>Sound</b><small>Pops, chimes and the floor-clear jingle</small></span>
      <button class="switch" id="sndSwitch" type="button" role="switch" aria-checked="true" aria-label="Sound"><i></i></button><span id="sndState" class="state">On</span></div>
    <p class="credit">Drag your mouse or finger to guide the minotaur. Arrow keys or WASD work too, and P pauses.</p>
    <fieldset><legend>Powerups</legend><div class="legend legend2" id="legend2"></div></fieldset>
    <fieldset><legend>Art style</legend><div id="styleList" class="styles"></div></fieldset>
    <p class="credit">A Tiny Minotaur game. <a href="https://tinyminotaur.co" target="_blank" rel="noopener">tinyminotaur.co</a></p>
  </div>
</div>


<script>
(() => {
  const TYPES = {
    treat:   { c: '#ff7ab6', g: 'T', name: 'Treat',   d: 'you run faster',          dur: 6 },
    mirror:  { c: '#5eead4', g: 'D', name: 'Decoy',   d: 'enemies chase a lantern',  dur: 7 },
    boo:     { c: '#7a8cff', g: 'B', name: 'Boo',     d: 'turn the tables: eat enemies, even frozen ones', dur: 7 },
    gravity: { c: '#c39bff', g: 'G', name: 'Gravity', d: 'wisp magnet',             dur: 7 },
    cold:    { c: '#9fd3ff', g: 'C', name: 'Cold',    d: 'freezes enemies',      dur: 5 },
  };
  const KEYS = Object.keys(TYPES);
  // one goal per floor; clear them all to win
  const GOALS = [
    { text: 'Eat 50 wisps', req: { wisps: 50 } },
    { text: 'Grab 4 powerups', req: { boxes: 4 } },
    { text: 'Eat 80 wisps', req: { wisps: 80 } },
    { text: 'Catch 3 enemies with Boo', req: { catches: 3 }, need: 'boo', needCount: 2 },
    { text: 'Fool 3 enemies with a Decoy', req: { fooled: 3 }, need: 'mirror', needCount: 2 },
    { text: 'Eat 120 wisps and grab 5 powerups', req: { wisps: 120, boxes: 5 } },
  ];
  const LABEL = { wisps: 'wisps', boxes: 'powerups', catches: 'caught', fooled: 'fooled' };
  const freshProg = () => ({ wisps: 0, boxes: 0, catches: 0, fooled: 0 });
  const LIVES = 5;
  const TORCH = '#ffb347', BONE = '#f1ecff';
  // every floor is a different painted vase: ground color, ink, border motif, maze openness, and one twist
  const THEMES = [
    { name: 'The Cellar', motif: 'meander', ground: ['#dc8841', '#cf7632', '#9c4a1d'], ink: '#14100d', cut: '#cf7632', cream: '#f4e8cf', plume: '#a32f1c',
      speck: '#5a2a0e', speck2: '#f0b070', page: '#1d0f08', accent: '#f2a65a', line: '#4a2a18', open: 0.3 },
    { name: 'Moss Gardens', motif: 'laurel', ground: ['#b3bd64', '#939e4a', '#566029'], ink: '#14100d', cut: '#939e4a', cream: '#f1ead0', plume: '#a32f1c',
      speck: '#2f3a12', speck2: '#dfe89a', page: '#10150a', accent: '#c9d36a', line: '#3a4220', open: 0.45 },
    { name: 'Frozen Vault', motif: 'zigzag', ground: ['#f6eed9', '#e7ddc4', '#b9b09a'], ink: '#1b2430', cut: '#e7ddc4', cream: '#ffffff', plume: '#3a78a8',
      speck: '#8a826c', speck2: '#ffffff', page: '#0d1519', accent: '#a8d8e6', line: '#2a444d', open: 0.3, slide: true },
    { name: 'Ember Forge', motif: 'meander', ground: ['#2d1a13', '#1a0e0a', '#080403'], ink: '#e0652f', cut: '#1a0e0a', cream: '#ffd9a8', plume: '#ff3b2b',
      speck: '#4a2216', speck2: '#7a3a22', page: '#0a0706', accent: '#ff8a4c', line: '#4a2418', open: 0.2 },
    { name: 'Tide Halls', motif: 'waves', ground: ['#56aaa9', '#3f8a8c', '#1f5254'], ink: '#0f1c1e', cut: '#3f8a8c', cream: '#e8f4ea', plume: '#e8774a',
      speck: '#0b2a2c', speck2: '#a6e8e2', page: '#07181a', accent: '#6ad0c8', line: '#1f4a4c', open: 0.35 },
    { name: 'Void Throne', motif: 'meander', ground: ['#2d1a58', '#1c1030', '#0a0518'], ink: '#c9a2ff', cut: '#1c1030', cream: '#fff0ff', plume: '#ff4fd8',
      speck: '#3a2468', speck2: '#8a5ad0', page: '#0b0614', accent: '#d8a8ff', line: '#3a2060', open: 0.15 },
  ];
  ['cross', 'circle', 'diamond', 'hourglass', 'wave', 'ziggurat'].forEach((sh, i) => (THEMES[i].shape = sh));
  [{}, {}, { twist: 'Ice: you keep sliding until you hit a wall' }, { twist: 'Lava vents erupt, so watch for the glow', twistKey: 'lava' }, { twist: 'Currents carry you along', twistKey: 'current' }, { twist: 'Some walls fade out for a few seconds', twistKey: 'phase' }].forEach((o, i) => Object.assign(THEMES[i], o));
  const theme = () => THEMES[(game.level - 1) % THEMES.length];
    // dx, dy, wall bit, opposite wall bit  (N=1, E=2, S=4, W=8)
  const DIRS = [[0, -1, 1, 4], [1, 0, 2, 8], [0, 1, 4, 1], [-1, 0, 8, 2]];

  const arena = document.getElementById('arena');
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  const overlay = document.getElementById('overlay');
  const $ = id => document.getElementById(id);
  const hLevel = $('hLevel'), hScore = $('hScore'), hLives = $('hLives'), statusEl = $('status'), gTitle = $('gTitle'), gProg = $('gProg');


  let best = 0;
  try { best = +localStorage.getItem('lantern-best') || 0; } catch (e) {}

  let muted = false, ac = null;
  try { muted = localStorage.getItem('lantern-muted') === '1'; } catch (e) {}
  function tone(f, d = 0.1, type = 'sine', v = 0.05, slide = 1, delay = 0) {
    if (muted) return;
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      if (ac.state === 'suspended') ac.resume();
      const o = ac.createOscillator(), g = ac.createGain(), t0 = ac.currentTime + delay;
      o.type = type; o.frequency.setValueAtTime(f, t0);
      if (slide !== 1) o.frequency.exponentialRampToValueAtTime(f * slide, t0 + d);
      g.gain.setValueAtTime(v, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
      o.connect(g); g.connect(ac.destination); o.start(t0); o.stop(t0 + d + 0.02);
    } catch (e) {}
  }
  const sfx = {
    wisp: n => tone(520 + (n % 6) * 70, 0.06, 'triangle', 0.035),
    box: () => { tone(520, 0.1, 'square', 0.04); tone(780, 0.14, 'square', 0.04, 1, 0.08); },
    caught: () => tone(220, 0.45, 'sawtooth', 0.08, 0.35),
    catch: () => { tone(330, 0.12, 'square', 0.05, 2); tone(660, 0.16, 'square', 0.05, 1.5, 0.1); },
    fool: () => tone(900, 0.2, 'sine', 0.06, 0.5),
    thud: () => { tone(120, 0.25, 'sine', 0.1, 0.5); tone(70, 0.3, 'sine', 0.08, 0.6, 0.05); },
    clang: () => { tone(1250, 0.07, 'square', 0.05, 0.6); tone(900, 0.16, 'triangle', 0.05, 0.5, 0.03); tone(1700, 0.1, 'square', 0.03, 0.7, 0.06); },
    bleat: () => { [0, 0.09, 0.18].forEach(d => tone(560 - d * 500, 0.1, 'sawtooth', 0.04, 0.85, d)); },
    ghostDie: () => { tone(700, 0.55, 'sine', 0.05, 0.4); tone(1050, 0.65, 'sine', 0.03, 0.4, 0.08); },
    shatter: () => { tone(1500, 0.14, 'triangle', 0.06, 0.3); tone(2100, 0.1, 'square', 0.03, 0.4, 0.04); tone(320, 0.7, 'sawtooth', 0.04, 0.5, 0.15); },
    sizzle: () => { tone(900, 0.5, 'sawtooth', 0.03, 0.3); tone(240, 0.5, 'square', 0.03, 0.5, 0.05); },
    clear: () => [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.16, 'triangle', 0.06, 1, i * 0.1)),
  };
  const isSmall = () => W < 560;
  const STYLES = {};
  const STYLE_ORDER = ['greek', 'pixel', 'riso', 'paper', 'watercolor'];
  let styleName = 'greek';
  try { const sv = localStorage.getItem('lantern-style'); if (STYLE_ORDER.includes(sv)) styleName = sv; } catch (e) {}
  const S = () => STYLES[styleName] || STYLES.greek;
  const rnd = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const pick = arr => arr[(Math.random() * arr.length) | 0];

  let W = 0, H = 0, dpr = 1;
  let cols = 0, rows = 0, cs = 48, ox = 0, oy = 0, pr = 12;
  let walls = null, dots = [], boxes = [], ghosts = [], parts = [];
  let me = null, spook = null, decoy = null, startCell = 0, segs = [];
  let hazard = { vents: [], currents: new Map(), phase: [] };
  const ptr = { x: 0, y: 0, seen: false };
  const game = {
    state: 'idle', level: 1, score: 0, lives: LIVES, prog: freshProg(), clock: 0, ready: 0, invuln: 0, chain: 0, clearT: 0,
    fx: { treat: 0, mirror: 0, boo: 0, gravity: 0, cold: 0 }, banner: null, shake: 0, flash: 0, hover: 0, paused: false, pausedByCard: false, stats: { wisps: 0, boxes: 0, catches: 0 },
  };

  /* ---------- maze ---------- */
  const cx = i => i % cols, cy = i => (i / cols) | 0;
  const px = i => ox + (cx(i) + 0.5) * cs, py = i => oy + (cy(i) + 0.5) * cs;
  const cellAt = (x, y) => clamp(Math.floor((y - oy) / cs), 0, rows - 1) * cols + clamp(Math.floor((x - ox) / cs), 0, cols - 1);
  let active = null, activeList = [], bsegs = [];
  const snapActive = i => { if (active[i]) return i; let best = activeList[0], bd = 1e9; for (const j of activeList) { const d = (cx(j) - cx(i)) ** 2 + (cy(j) - cy(i)) ** 2; if (d < bd) { bd = d; best = j; } } return best; };
  const mirrorCell = i => snapActive((rows - 1 - cy(i)) * cols + (cols - 1 - cx(i)));
  const randActive = () => activeList[(Math.random() * activeList.length) | 0];
  const dirNb = (i, d) => { const c = cx(i) + DIRS[d][0], r = cy(i) + DIRS[d][1]; return c < 0 || r < 0 || c >= cols || r >= rows ? -1 : r * cols + c; };
  function nb(i) {
    const out = [];
    for (let d = 0; d < 4; d++) { const j = dirNb(i, d); if (j >= 0 && !(walls[i] & DIRS[d][2])) out.push(j); }
    return out;
  }
  // each floor is a different shape of labyrinth
  const SHAPES = {
    cross: (u, v) => Math.abs(u - 0.5) <= 0.21 || Math.abs(v - 0.5) <= 0.23,
    circle: (u, v) => ((u - 0.5) / 0.5) ** 2 + ((v - 0.5) / 0.5) ** 2 <= 1,
    diamond: (u, v) => Math.abs(u - 0.5) + Math.abs(v - 0.5) <= 0.52,
    hourglass: (u, v) => Math.abs(u - 0.5) <= 0.5 * (0.3 + 0.7 * Math.abs(2 * v - 1)),
    wave: (u, v) => Math.abs(v - (0.5 + 0.17 * Math.sin(u * Math.PI * 3))) <= 0.3,
    ziggurat: (u, v) => Math.abs(u - 0.5) <= 0.5 * (0.28 + 0.72 * (Math.ceil(v * 4) / 4)),

    Object.assign(game, { state: 'play', level: 1, score: 0, lives: LIVES, chain: 0, prog: freshProg(), stats: { wisps: 0, boxes: 0, catches: 0 } });
    setupLevel(); overlay.hidden = true;
  }
  function goalMet() { return Object.entries(GOALS[game.level - 1].req).every(([k, n]) => game.prog[k] >= n); }
  function saveBest() {
    const isBest = game.score > best;
    if (isBest) { best = game.score; try { localStorage.setItem('lantern-best', String(best)); } catch (e) {} }
    return isBest;
  }
  /* ---------- share the result as text and as an image card ---------- */
  function minoHead(g, x, y, s, col, cut) {

    g.beginPath(); g.moveTo(x - s * 1.15, y + s * 2.1); g.quadraticCurveTo(x - s * 1.0, y + s * 0.75, x, y + s * 0.7); g.quadraticCurveTo(x + s * 1.0, y + s * 0.75, x + s * 1.15, y + s * 2.1); g.closePath(); g.fill();
    g.beginPath(); g.arc(x, y, s, 0, 6.283); g.fill();
    g.lineWidth = s * 0.36; g.beginPath(); g.moveTo(x - s * 0.7, y - s * 0.5); g.quadraticCurveTo(x - s * 1.8, y - s * 0.4, x - s * 1.4, y - s * 1.75); g.moveTo(x + s * 0.7, y - s * 0.5); g.quadraticCurveTo(x + s * 1.8, y - s * 0.4, x + s * 1.4, y - s * 1.75); g.stroke();
    g.beginPath(); g.ellipse(x, y + s * 0.5, s * 0.55, s * 0.4, 0, 0, 6.283); g.fill();
    g.strokeStyle = cut; g.lineWidth = Math.max(2, s * 0.05);
    [-1, 1].forEach(d => { g.beginPath(); g.ellipse(x + d * s * 0.4, y - s * 0.15, s * 0.2, s * 0.1, -d * 0.35, 0, 6.283); g.stroke(); g.beginPath(); g.arc(x + d * s * 0.2, y + s * 0.55, s * 0.04, 0, 6.283); g.stroke(); });
    g.restore();
  }
  function cardCanvas() {
    const T = theme(), won = game.state === 'won', c = document.createElement('canvas'); c.width = 1200; c.height = 630; const g = c.getContext('2d');
    const gr = g.createRadialGradient(600, 315, 60, 600, 315, 760); gr.addColorStop(0, T.ground[0]); gr.addColorStop(0.7, T.ground[1]); gr.addColorStop(1, T.ground[2]); g.fillStyle = gr; g.fillRect(0, 0, 1200, 630);
    const r = seeded(9); g.fillStyle = T.speck; for (let i = 0; i < 2600; i++) { g.globalAlpha = 0.05 + r() * 0.15; g.beginPath(); g.arc(r() * 1200, r() * 630, 0.5 + r() * 1.2, 0, 6.283); g.fill(); } g.globalAlpha = 1;
    g.strokeStyle = T.ink; g.lineWidth = 10; g.strokeRect(18, 18, 1164, 594); g.lineWidth = 3; g.strokeRect(36, 36, 1128, 558);
    (MOTIFS[T.motif] || meander)(g, 70, 58, 1060, 6.5, T.ink); (MOTIFS[T.motif] || meander)(g, 70, 538, 1060, 6.5, T.ink);
    g.textAlign = 'center'; g.textBaseline = 'middle'; g.lineJoin = 'round';
    g.font = '800 70px Cinzel, Georgia, serif'; g.lineWidth = 12; g.strokeStyle = '#0a0705'; g.strokeText('Lantern Labyrinth', 600, 150); g.fillStyle = T.cream; g.fillText('Lantern Labyrinth', 600, 150);
    g.font = '700 44px Gabarito, sans-serif'; const line = won ? 'I escaped the labyrinth!' : `Made it to floor ${game.level} of ${GOALS.length}`; g.lineWidth = 9; g.strokeText(line, 600, 232); g.fillStyle = T.accent; g.fillText(line, 600, 232);
    g.font = '800 168px Gabarito, sans-serif'; g.lineWidth = 16; g.strokeText(String(game.score), 600, 365); g.fillStyle = T.cream; g.fillText(String(game.score), 600, 365);
    g.font = '600 30px Gabarito, sans-serif'; g.lineWidth = 7; const st = `${game.stats.wisps} wisps   ${game.stats.boxes} powerups   ${game.stats.catches} enemies caught`; g.strokeText(st, 600, 470); g.fillStyle = T.cream; g.fillText(st, 600, 470);
    g.font = '600 26px "DM Mono", monospace'; g.lineWidth = 6; g.strokeText('tinyminotaur.co/lantern-labyrinth', 600, 515); g.fillStyle = T.accent; g.fillText('tinyminotaur.co/lantern-labyrinth', 600, 515);
    minoHead(g, 170, 330, 62, T.ink, T.cut);
    g.save(); g.translate(1030, 340); g.rotate(0.3); g.strokeStyle = T.ink; g.lineWidth = 8; g.lineCap = 'round'; for (let i = 0; i < 12; i++) { g.rotate(6.283 / 12); g.beginPath(); g.moveTo(44, 0); g.lineTo(i % 2 ? 66 : 86, 0); g.stroke(); } g.fillStyle = T.cream; g.beginPath(); g.arc(0, 0, 36, 0, 6.283); g.fill(); g.stroke(); g.fillStyle = '#c0452a'; g.beginPath(); g.arc(0, 0, 14, 0, 6.283); g.fill(); g.restore();

  const cardBlob = () => new Promise(res => cardCanvas().toBlob(b => res(b), 'image/png'));
  const resultText = () => `${game.state === 'won' ? 'I escaped the labyrinth' : 'I made it to floor ' + game.level + ' of ' + GOALS.length} in Lantern Labyrinth with ${game.score} points. https://tinyminotaur.co/lantern-labyrinth`;
  async function shareResult(btn) {
    const text = resultText(), label = btn.textContent;
    try {
      const blob = await cardBlob(), file = blob && new File([blob], 'lantern-labyrinth.png', { type: 'image/png' });

    const blob = await cardBlob(); if (!blob) return;
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'lantern-labyrinth.png'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    const label = btn.textContent; btn.textContent = 'Saved'; setTimeout(() => (btn.textContent = label), 1600);
  }

  function winGame() {
    game.state = 'won';
    const isBest = saveBest();
    showCard(`<h2>You escaped!</h2><div class="big">${game.score}</div><p>All ${GOALS.length} floors cleared. ${isBest ? 'New best.' : 'Best: ' + best}</p><button data-act="play">Play again</button><div class="btnrow"><button class="alt" data-act="share">Share result</button><button class="alt" data-act="save">Save image</button></div>`);
  }
  function endGame() {
    game.state = 'over';
    const isBest = saveBest();
    showCard(`<h2>Out of lives</h2><div class="big">${game.score}</div><p>You made it to floor ${game.level} of ${GOALS.length}. ${isBest ? 'New best.' : 'Best: ' + best}</p><button data-act="play">Play again</button><div class="btnrow"><button class="alt" data-act="share">Share result</button><button class="alt" data-act="save">Save image</button></div>`);
  }
  function intro() {
    showCard(`<h2>Lantern Labyrinth</h2>
      <p class="goal">Clear <b>6 floors</b>. Each floor has a goal, like eating wisps or opening boxes. Reach it before you lose all <b>5 lives</b>.</p>
      <p>You are the <b>guide</b>, the glowing lantern that leads the minotaur. Two enemies, two targets: the <b>ghost</b> floats through walls after <b>you</b>, and <b>wardens</b> chase the <b>minotaur</b> through the corridors. Either one catching its target costs a life.</p>
      <p>The minotaur follows your guide but can't pass walls, so keep moving away from the ghost. Grab powerups for special abilities.</p>
      <p>On a phone, drag your finger. On a keyboard, use the arrow keys or WASD. P pauses.</p><button>Play</button>`);
  }

  /* ---------- input (pointer events: mouse + touch + pen) ---------- */
  function setPtr(e) {
    if (!settingsEl.hidden || e.target.closest && e.target.closest('#gear')) return;
    const r = cv.getBoundingClientRect();
    const lift = e.pointerType === 'touch' ? 46 : 0; // on touch screens the guide floats above your fingertip so you can see it

  window.addEventListener('pointermove', setPtr); // keep following even when your pointer leaves the maze or the arena
  window.addEventListener('pointerdown', setPtr);

  /* ---------- loop ---------- */
  function resize() {
    const r = arena.getBoundingClientRect();
    if (r.width < 120 || r.height < 120) return; // not laid out yet: the frame loop retries
    W = r.width; H = r.height; dpr = Math.min(window.devicePixelRatio || 1, 2);

    setupLevel();
    if (game.state === 'idle') game.banner = null;
  }
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.033, (now - last) / 1000); last = now;

      if (Math.abs(arena.clientWidth - W) > 1 || Math.abs(arena.clientHeight - H) > 1 || !walls) {
        if (++sizeWait > 8 || !walls) { resize(); sizeWait = 0; }
      } else sizeWait = 0;
      if (walls) { if (!game.paused) update(dt); draw(); }
    } catch (e) { console.error(e); }
    requestAnimationFrame(frame);
  }
  let sizeWait = 0;
  buildLegend();
  buildSettings();
  intro();
  requestAnimationFrame(frame);
})();
